# The worker is intentionally local-only. Publish it through an authenticated
# reverse proxy; do not change this address to 0.0.0.0.
host: 127.0.0.1
port: 8766

max_queued_jobs: 50
max_upload_bytes: 1073741824  # 1 GiB of compressed Opus audio
max_audio_hours: 24
reservation_ttl_seconds: 300
upload_ready_ttl_seconds: 30
terminal_job_ttl_seconds: 60
upload_timeout_seconds: 3600
job_timeout_seconds: 86400

# Machine-specific worker settings. force_cpu applies to Whisper and Pyannote.
force_cpu: false
cpu_threads: 8
vad_threshold: 0.5
whisper_models_dir: models

# On Linux production systems this should point to a size-limited tmpfs.
runtime_dir: /run/noscribe-server
require_tmpfs: true
